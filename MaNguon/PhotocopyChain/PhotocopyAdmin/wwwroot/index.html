<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhotocopyChain · Quản trị</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="PhotocopyAdmin.styles.css" />
    <link rel="stylesheet" href="css/app-ui-v2.css?v=20261014-preview-align" />
    <link rel="icon" type="image/png" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Đã xảy ra lỗi không mong muốn.
        <a href="" class="reload">Tải lại</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>window.moLienHeFooter = hop => hop.showModal();
        window.dashboardDangHienThi = () => document.visibilityState === 'visible';
        window.moMauDon = hop => hop.showModal();
        window.moFormMauDon = window.moHopThoaiQuanTri = hop => {
            // cancel của dialog không nổi bọt; bắt trực tiếp để Esc đi qua cùng nút đóng của Blazor.
            hop.oncancel = event => {
                event.preventDefault();
                const nutDong = hop.querySelector('[data-dong-form-mau], [data-dong-popup]');
                if (nutDong && !nutDong.disabled) nutDong.click();
            };
            hop.onkeydown = event => {
                // Bản xem trước của máy quét có thể mở trên popup lập đơn.
                if (event.target.closest('dialog') !== hop) return;
                if (event.key !== 'Tab') return;
                const cacO = Array.from(hop.querySelectorAll('button:not(:disabled), input:not(:disabled), textarea:not(:disabled), select:not(:disabled), a[href], summary, [tabindex]:not([tabindex="-1"])'))
                    .filter(o => o.getClientRects().length > 0);
                if (cacO.length === 0) { event.preventDefault(); return; }
                const dau = cacO[0], cuoi = cacO[cacO.length - 1];
                // Giữ vòng Tab/Shift+Tab trong form, không nhảy ra thanh địa chỉ.
                if (event.shiftKey && document.activeElement === dau) { event.preventDefault(); cuoi.focus(); }
                else if (!event.shiftKey && document.activeElement === cuoi) { event.preventDefault(); dau.focus(); }
            };
            if (!hop.open) {
                hop.showModal();
                const oDau = hop.querySelector('[autofocus]:not(:disabled), input:not(:disabled):not([type="hidden"]), select:not(:disabled), textarea:not(:disabled)');
                if (oDau) oDau.focus();
            }
        };
        window.dongMauDon = hop => hop.close();</script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
